name: Secret hygiene

# lochan-qapp is a PUBLIC repo, and the app's .env.prod beside packages.json
# holds REAL secrets (generate-app-config writes it; bin/deploy-app reads it).
# The ONLY thing standing between it and a leaked credential is a .gitignore
# rule. That rule is load-bearing, so it gets a test rather than a habit.
#
# This gate is written to be provably able to BOTH pass and fail: it asserts
# against known-bad fixtures (files that MUST be ignored) and a known-good
# fixture (packages.json, which MUST stay tracked). A check that can only pass
# is a comment, not a gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secret-hygiene:
    name: each tier's .env must be ignored, packages.json must be tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert secret files are gitignored
        run: |
          set -euo pipefail
          fail=0

          # KNOWN-BAD fixtures: each of these MUST be ignored.
          # We create them so the assertion runs against real paths rather
          # than trusting the .gitignore text to mean what it looks like.
          for f in .env .env.prod .env.staging .env.dev .env.local secrets.key app.priv; do
            : > "$f"
            if git check-ignore -q "$f"; then
              echo "  ok: $f is ignored"
            else
              echo "::error::$f is NOT gitignored — a real secret here would be committable"
              fail=1
            fi
            rm -f "$f"
          done

          # KNOWN-GOOD fixture: packages.json MUST NOT be ignored, or the app
          # would ship with nothing to build. This is the half that proves the
          # check can distinguish, rather than ignoring everything and
          # reporting success.
          if [ ! -f packages.json ]; then
            echo "::error::packages.json is missing — the app names no package"
            fail=1
          elif git check-ignore -q packages.json; then
            echo "::error::packages.json IS ignored — it must ship with the repo"
            fail=1
          else
            echo "  ok: packages.json is tracked"
          fi

          # Nothing resembling a real secret may be committed.
          if git ls-files | grep -qE '(^|/)\.env($|\.)' ; then
            echo "::error::a .env file is TRACKED in git:"
            git ls-files | grep -E '(^|/)\.env($|\.)' >&2
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "Secret hygiene: all fixtures behaved as required."
